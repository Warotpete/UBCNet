<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Post</title>
    <!-- Link to the CSS file -->
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/script.js" defer></script>
</head>
<body>
<header>
    <div class="header-container">
        <div class="site-title">
            <h1>UBCNet</h1>
        </div>
        <!-- Navigation bar -->
        <nav class="nav-links">
            <a href="/">Home</a>
            <a href="/announcements">Announcements</a>
            <a href="/housing">Housing</a>
            <a href="/shop">Shop</a>
            <a href="/post">Post</a>
        </nav>
    </div>
</header>
<main>
<main>
    <h2>Create a Post</h2>
    <!-- Create a dropdown select option for each types of post -->
    <form id="post-form" action="/create-post" method="post" enctype="multipart/form-data" class="post-form">
        <!-- Post Type Selection -->
        <div class="form-group">
            <label for="postType">Choose Post Type:</label>
            <select id="postType" name="postType" onchange="toggleFields()" required>
                <option value="">Select Type</option>
                <option value="announcement">Announcement</option>
                <option value="shop">Shop</option>
                <option value="housing">Housing</option>
            </select>
        </div>

        <!--
        The form below is used to create a post with different types of fields based on the selected post type.
        There are three types of posts: Announcement, Shop, and Housing.

        - Announcement Fields:
          - Title: Text input for the announcement's title.
          - Message: Textarea input for the announcement's message.

        - Shop Fields:
          - Title: Text input for the shop item's title.
          - Image URL: Text input for the URL of the image. Only accepts direct link address.
            Instructions provided for uploading and linking.
          - Description: Textarea input for the shop item's description.
          - Price: Number input for the shop item's price with up to 2 decimal places.
          - Condition: Select input for the shop item's condition (New or Used).
          - Contact information: Text input for the seller's contact email.

        - Housing Fields:
          - Title: Text input for the housing listing's title.
          - Image URL: Text input for the URL of the image. Only accepts direct link address.
            Instructions provided for uploading and linking.
          - Description: Textarea input for the housing listing's description.
          - Rent Per Month: Number input for the monthly rent with up to 2 decimal places.
          - Location: Text input for the housing listing's location.
          - Contact information: Text input for the landlord's contact email.
        -->

        <!-- Announcement Fields -->
        <div id="announcement-fields" class="post-fields" style="display: none;">
            <!-- Get all the announcement Fields -->
            <div class="form-group">
                <label for="announcement-title">Title:</label>
                <input type="text" id="announcement-title" name="title" required>
            </div>
            <div class="form-group">
                <label for="announcement-message">Message:</label>
                <textarea id="announcement-message" name="message" rows="4" required></textarea>
            </div>
            <!-- When submit button is clicked, run the handleSubmit() function in javascript -->
            <input type="submit" class="submit-button" onclick="handleSubmit()">
        </div>

        <!-- Shop Fields -->
        <div id="shop-fields" class="post-fields" style="display: none;">
            <!-- Get all the items Fields -->
            <div class="form-group">
                <label for="shop-title">Title:</label>
                <input type="text" id="shop-title" name="title" required>
            </div>
            <div class="form-group">
                <!-- Instruction for how to upload image, since the app can only accept image as direct url -->
                <label for="shop-images">Image URL: (use this <a href="https://postimages.org" target="_blank">link</a> to upload your image and paste the direct link below) </label>
                <input type="text" id="shop-images" name="images" multiple accept="image/*">
            </div>
            <div class="form-group">
                <label for="shop-description">Description:</label>
                <textarea id="shop-description" name="description" rows="4" required></textarea>
            </div>
            <div class="form-group">
                <label for="shop-price">Price (up to 2 decimals):</label>
                <input type="number" step="0.01" min="0" id="shop-price" name="price" required>
            </div>
            <div class="form-group">
                <label for="shop-condition">Condition:</label>
                <select id="shop-condition" name="condition" required>
                    <option value="New">New</option>
                    <option value="Used">Used</option>
                </select>
                <div class="form-group">
                    <label for="shop-email">Contact information:</label>
                    <input type="text" id="shop-email" name="email" required>
                </div>
            </div>
            <!-- When submit button is clicked, run the handleSubmit() function in javascript -->
            <input type="submit" class="submit-button" onclick="handleSubmit2()">
        </div>

        <!-- Housing Fields -->
        <div id="housing-fields" class="post-fields" style="display: none;">
            <!-- Get all the housing Fields -->
            <div class="form-group">
                <label for="housing-title">Title:</label>
                <input type="text" id="housing-title" name="title" required>
            </div>
            <div class="form-group">
                <!-- Instruction for how to upload image, since the app can only accept image as direct url -->
                <label for="shop-images">Image URL: (use this <a href="https://postimages.org" target="_blank">link</a> to upload your image and paste the direct link below) </label>
                <input type="text" id="housing-images" name="images" multiple accept="image/*">
            </div>
            <div class="form-group">
                <label for="housing-description">Description:</label>
                <textarea id="housing-description" name="description" rows="4" required></textarea>
            </div>
            <div class="form-group">
                <label for="housing-price">Rent Per Month (up to 2 decimals):</label>
                <input type="number" step="0.01" min="0" id="housing-price" name="rentPerMonth" required>
            </div>
            <div class="form-group">
                <label for="housing-location">Location:</label>
                <input type="text" id="housing-location" name="location" required>
            </div>
            <div class="form-group">
                <label for="housing-email">Contact information:</label>
                <input type="text" id="housing-email" name="email" required>
            </div>
            <!-- When submit button is clicked, run the handleSubmit() function in javascript -->
            <input type="submit" class="submit-button" onclick="handleSubmit3()">
        </div>
    </form>
</main>
</body>
</html>
